# -------------------------------------------------------------------------
# Mutations for Vanguard
# -------------------------------------------------------------------------

# Create a new Engagement
mutation CreateEngagement(
  $teamId: UUID!, 
  $type: EngagementType = INTERVIEW,
  $customerName: String!, 
  $title: String = "", 
  $context: String = ""
) @auth(level: USER) {
  engagement_insert(data: {
    team: { id: $teamId },
    user: { uid_expr: "auth.uid" },
    type: $type,
    customerName: $customerName,
    title: $title,
    context: $context,
    status: CREATED
  })
}

# Update Engagement Status (e.g. PROCESSING -> COMPLETED)
mutation UpdateEngagementStatus($id: UUID!, $status: EngagementStatus!) @auth(level: USER) {
  engagement_update(
    id: $id, 
    data: { 
      status: $status,
      updatedAt_expr: "request.time"
    }
  )
}

# Create a new Artifact under an Engagement
mutation CreateArtifact(
  $engagementId: UUID!,
  $type: ArtifactType!,
  $storageUrl: String!,
  $fileName: String!,
  $fileSizeBytes: Int64
) @auth(level: USER) {
  artifact_insert(data: {
    engagement: { id: $engagementId },
    type: $type,
    storageUrl: $storageUrl,
    fileName: $fileName,
    fileSizeBytes: $fileSizeBytes
  })
}

# Create a new Insight
mutation CreateInsight(
  $engagementId: UUID!,
  $dimension: InsightDimension!,
  $content: String!,
  $confidence: Float = 0.85
) @auth(level: USER) {
  insight_insert(data: {
    engagement: { id: $engagementId },
    user: { uid_expr: "auth.uid" },
    dimension: $dimension,
    content: $content,
    confidence: $confidence
  })
}

# Mark Insight as promoted
mutation MarkInsightPromoted($id: UUID!) @auth(level: USER) {
  insight_update(id: $id, data: { isPromoted: true })
}


