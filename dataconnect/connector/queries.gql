# -------------------------------------------------------------------------
# Queries for Vanguard
# -------------------------------------------------------------------------

# List Engagements for a specific team, ordered by most recent first
query ListEngagements($teamId: UUID!) @auth(level: USER) {
  engagements(
    where: { team: { id: { eq: $teamId } } },
    orderBy: [{ createdAt: DESC }]
  ) {
    id
    type
    status
    customerName
    title
    createdAt
    user {
      uid
      displayName
    }
  }
}

# Get detailed Engagement including Artifacts and Insights
query GetEngagementDetails($id: UUID!) @auth(level: USER) {
  engagement(id: $id) {
    id
    type
    status
    customerName
    title
    context
    createdAt
    updatedAt
    user {
      uid
      displayName
    }
    
    # Associated Artifacts
    artifacts_on_engagement {
      id
      type
      storageUrl
      fileName
      fileSizeBytes
      createdAt
    }
    
    # Associated Insights
    insights_on_engagement {
      id
      dimension
      content
      confidence
      isPromoted
      createdAt
    }
  }
}

# Search Knowledge Base using full-text search (@searchable)
query SearchKnowledgeBase($query: String!, $teamId: UUID!) @auth(level: USER) {
  knowledgeItems_search(
    query: $query,
    where: { team: { id: { eq: $teamId } } }
  ) {
    id
    title
    summary
    category
    confidence
    createdAt
  }
}

# Get specific Knowledge Item
query GetKnowledgeItem($id: UUID!) @auth(level: USER) {
  knowledgeItem(id: $id) {
    id
    title
    summary
    keywords
    category
    content
    source
    confidence
    createdAt
  }
}
