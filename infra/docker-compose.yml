services:
  # 带 pgvector 向量扩展的 PostgreSQL 实例
  postgres:
    image: ankane/pgvector:v0.8.0
    container_name: vanguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vanguard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vanguard"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Vanguard 全栈服务容器 (Rust Backend + React 19 UI)
  vanguard-server:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: vanguard-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://postgres:postgres@postgres:5432/vanguard"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GCS_BUCKET_NAME: "${GCS_BUCKET_NAME:-vanguard-artifacts-ailab}"
      VANGUARD_AUTH_MOCK: "true"
      RUST_LOG: "info,vanguard=debug"
    ports:
      - "8080:8080"

volumes:
  pgdata:
    driver: local
