steps:
  # 1. Build Docker container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'us-central1-docker.pkg.dev/evotensor-ai-lab/vanguard/vanguard-engine:$BUILD_ID', '-f', 'infra/Dockerfile', '.']

  # 2. Push image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/evotensor-ai-lab/vanguard/vanguard-engine:$BUILD_ID']

  # 3. Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'vanguard-engine'
      - '--image=us-central1-docker.pkg.dev/evotensor-ai-lab/vanguard/vanguard-engine:$BUILD_ID'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--set-env-vars=GEMINI_API_KEY=AIzaSyCvrnlVbIrj7UXLIHfxazD6rGLkeE50la0'
images:
  - 'us-central1-docker.pkg.dev/evotensor-ai-lab/vanguard/vanguard-engine:$BUILD_ID'
